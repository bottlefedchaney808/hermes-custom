        install_as: example-dashboard
        enable: true
      - kind: agent-plugin
        from: strike-freedom-cockpit
        install_as: strike-freedom-cockpit
        enable: true

  - name: equity-research
    source: skills/equity-research
    summary: >-
      Institutional-grade single-stock research skill v3.0.0 (unpacked from
      equity-research-skill-v3.0.0.zip).
    profiles: [default, coder, tiferet]
    surfaces:
      - kind: skill
        from: .
        mode: copy   # skills are ALWAYS copies -- see defaults note

  # ── desktop: GLOBAL. `profiles:` is intentionally absent. ────────────────

  - name: bot-kit-desktop
    source: hermes-bot-kit
    summary: >-
      The four desktop halves of Hermes Bot Kit — iMessage-style Bot Chat,
      named roster sections, a pinned Tasks dock, and Agent Eyes (what the focused bot is looking at: live page + stills).
    global: true
    surfaces:
      - kind: desktop-plugin
        from: bubble-mode
        install_as: bubble-mode
      - kind: desktop-plugin
        from: bot-sections
        install_as: bot-sections
      - kind: desktop-plugin
        from: task-dock
        install_as: task-dock
      - kind: desktop-plugin
        from: agent-eyes
        install_as: agent-eyes
    notes: >-
      Upstream installs via `curl | bash`, which is not a thing on this machine.
      fleet materializes them directly — same result, idempotent, no network,
      and pinned to this repo's checkout. Agent Eyes shows the focused bot's page + stills (replaces the old Computer VNC surface).

  - name: hermes-fleet
    source: hermes-fleet
    summary: >-
      This fleet, as a UI. An open widget grid (drag / resize / swap /
      trash-to-delete, themed off --home-accent so it sits beside Home rather
      than fighting it) with a PUBLIC widget registry other plugins can register
      into — plus the package x profile matrix, live drift against this file,
      and per-profile context budget.
    profiles: [default, coder, tiferet]
    surfaces:
      - kind: agent-plugin
        install_as: hermes-fleet
        enable: true
    notes: >-
      A unified package: the agent half (plugin.yaml + plugin_api.py) installs
      into all three profiles, and the desktop app copies `desktop/plugin.js`
      out to ~/.hermes/desktop-plugins/hermes-fleet/ by itself. Built this way
      deliberately — one entry, both halves, and the desktop half stays global
      the way the loader wants.

  # ── authored here, installed on both hosts ───────────────────────────────

  - name: fleet-skills
    source: skills
    summary: >-
      Skills written in this repo rather than vendored from a package. Today
      that is `hermes-fleet` — how to operate a three-profile install without
      breaking one of them.
    profiles: [default, coder, tiferet]
    surfaces:
      - kind: claude-skill
        from: claude
        all: true
      - kind: skill
        from: hermes
        category: hermes
        mode: copy   # skills are ALWAYS copies — see defaults note
    notes: >-
      `skills/claude/` is the source of truth and `skills/hermes/` is GENERATED
      from it by `fleet port`. Both halves install from this one package, which
      is the point: edit the Claude side, re-port, sync, and both hosts move
      together instead of drifting into two different answers to the same
      question. See skills/PORTING.md.

# ── claude code ─────────────────────────────────────────────────────────────
# Skills whose HOME is Claude Code, not Hermes. The file format is identical
# (`SKILL.md` + name/description frontmatter — ~/.claude/skills/brainstorming
# and ~/.hermes/profiles/local/skills/brainstorming are byte-identical today),
# so "porting" is never a format conversion. It is a CONTENT port: Claude tool
# names and paths map to Hermes ones, and Hermes nests skills under a category
# directory while Claude is flat. See skills/PORTING.md and fleet/port.py.
claude:
  home: ~/.claude
  skills_dir: ~/.claude/skills
  # Source of truth for both halves. `claude/` installs to ~/.claude/skills;
  # `hermes/` is generated from it by fleet/port.py and installs per profile.
  source: skills
